<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Agent Payment Adjudicator</title>
  <desc id="d">A shield holding scales of justice: escrowed funds weighed by consensus and awarded to the party found owed.</desc>

  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d11"/>
      <stop offset="1" stop-color="#1c130c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2dcaa"/>
      <stop offset="1" stop-color="#c9a254"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1c130c"/>

  <g transform="translate(0,4)">
    <ellipse cx="256" cy="440" rx="150" ry="20" fill="#e8c98a" opacity=".12" filter="url(#soft)"/>

    <!--
      Shield: the conventional escrow/dispute container. It reads as protection
      at a glance, which is the point - the deposit is held, not spent.
    -->
    <path d="M256 66l128 46v122c0 84-54 142-128 168-74-26-128-84-128-168V112z"
          fill="url(#shield)" stroke="url(#gold)" stroke-width="11" stroke-linejoin="round"/>

    <!-- inner rule, so the shield reads as a badge rather than a blob -->
    <path d="M256 100l96 34v100c0 63-40 107-96 129-56-22-96-66-96-129v-100z"
          fill="none" stroke="#e8c98a" stroke-width="4" opacity=".28"/>

    <!--
      Scales of justice: the standard arbitration mark. The beam sits level
      because no verdict has been reached yet - escrow holds value without
      favouring either side.
    -->
    <g stroke="#e8c98a" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M256 156v168"/>
      <path d="M160 196h192"/>
      <path d="M212 324h88"/>
      <path d="M160 196v34M352 196v34" stroke-width="6" opacity=".85"/>
    </g>

    <!-- pans, filled so they read as bowls rather than lines -->
    <path d="M132 230h56l-28 40a28 28 0 01-56 0z" fill="url(#gold)"/>
    <path d="M324 230h56a28 28 0 01-56 0z" fill="url(#gold)"/>

    <!-- fulcrum, drawn last so it sits over the post joint -->
    <circle cx="256" cy="196" r="12" fill="#f2dcaa"/>

    <!--
      Coin on the left pan: the escrowed deposit, and the reason a balance
      exists at all. Sits proud of the pan so it reads as value being weighed
      rather than decoration.
    -->
    <circle cx="160" cy="243" r="16" fill="#e8c98a" stroke="#1c130c" stroke-width="4"/>
  </g>
</svg>