<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Agent Payment Adjudicator</title>
  <desc id="d">A coin held in escrow between a payer and an agent, released toward one of them by a consensus verdict.</desc>

  <defs>
    <linearGradient id="held" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c98a"/>
      <stop offset="1" stop-color="#b8903f"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="512" height="512" rx="112" fill="#1c130c"/>

  <!--
    The mark is translated down so it sits optically centred: the validators sit
    above the coin, so an unshifted composition reads as top-heavy.
  -->
  <g transform="translate(0,30)">
    <ellipse cx="256" cy="430" rx="168" ry="22" fill="#e8c98a" opacity=".12" filter="url(#soft)"/>

    <!-- payer, left: the one who deposited, and is owed if the claim fails -->
    <circle cx="118" cy="300" r="40" fill="none" stroke="#a08a6b" stroke-width="8" opacity=".78"/>
    <path d="M118 284v32M104 292h28M104 308h28" stroke="#a08a6b" stroke-width="7"
          stroke-linecap="round" opacity=".8" fill="none"/>

    <!-- agent, right: the one who did the work, paid if the claim holds -->
    <circle cx="394" cy="300" r="40" fill="none" stroke="#7bd88f" stroke-width="8" opacity=".88"/>
    <path d="M380 302l11 12 22-24" stroke="#7bd88f" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!--
      The verdict decides the direction. Solid to the payer, dashed to the
      agent: exactly one route is taken, and which one is not fixed by the
      design - the evidence decides it. Dashed rather than hidden, so both
      remain possible until consensus resolves.
    -->
    <g stroke-linecap="round" fill="none">
      <path d="M228 240c-26 16-58 30-92 44" stroke="#e08a7a" stroke-width="8" opacity=".92"/>
      <path d="M284 240c26 16 58 30 92 44" stroke="#7bd88f" stroke-width="8"
            stroke-dasharray="6 20" opacity=".82"/>
    </g>

    <!-- the coin, held level between the two parties: escrow -->
    <circle cx="256" cy="200" r="52" fill="url(#held)" stroke="#e8c98a" stroke-width="7"/>
    <path d="M256 174v52" stroke="#1c130c" stroke-width="9" stroke-linecap="round" opacity=".6"/>
    <path d="M240 190h32M240 210h32" stroke="#1c130c" stroke-width="7"
          stroke-linecap="round" opacity=".46"/>

    <!-- three validators converging on a single verdict -->
    <path d="M196 128c14-14 34-22 52-22M316 128c-14-14-34-22-52-22"
          stroke="#e8c98a" stroke-width="6" stroke-linecap="round" fill="none" opacity=".82"/>
    <circle cx="176" cy="140" r="10" fill="#e8c98a"/>
    <circle cx="336" cy="140" r="10" fill="#e8c98a"/>
    <circle cx="256" cy="96" r="27" fill="#e8c98a"/>
    <circle cx="256" cy="96" r="11" fill="#1c130c"/>
  </g>
</svg>