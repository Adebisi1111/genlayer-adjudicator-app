services:
  - type: web
    name: genlayer-adjudicator-relay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # No SERVER_PRIVATE_KEY. The relay is read-only and signs nothing; every
      # write is signed by the user's own wallet in the browser. Requesting a
      # key here would make Render prompt for one and leave an unused secret in
      # the deployment settings - exactly the custody risk this change removes.
      - key: GENLAYER_RPC
        value: https://rpc-bradbury.genlayer.com